name: OperaIQ CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: operaiq
  GCP_REGION: us-central1
  AR_REPO: operaiq-images
  MCP_SERVICE: operaiq-mcp-server
  AGENT_SERVICE: operaiq-agents
  FRONTEND_SERVICE: operaiq-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Type-check + Build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend TypeScript + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # MCP Server — Python Tests
  # ─────────────────────────────────────────────────────────────────────────
  mcp-server-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-mock httpx anyio[trio]
      - name: Run unit tests (offline, mocked GCP)
        run: python -m pytest tests/ -v --tb=short -k "not integration"
        env:
          TEST_TOKEN: test-viewer-token
          TEST_OPERATOR_TOKEN: test-operator-token
          GCP_PROJECT_ID: operaiq
          BQ_DATASET: operaiq
          ENV: test
          CHROMADB_PERSIST_DIR: /tmp/operaiq-test-chroma

  # ─────────────────────────────────────────────────────────────────────────
  # Agent Service — Python Tests
  # ─────────────────────────────────────────────────────────────────────────
  agent-service-tests:
    name: Agent Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio[trio]
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        env:
          ENV: test

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to Cloud Run (main branch only, on push)
  # Uses Cloud Build (gcloud builds submit) — no local Docker required.
  # Requires GCP_SA_KEY secret in GitHub repo settings.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [frontend-check, mcp-server-tests, agent-service-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── MCP Server ─────────────────────────────────────────────────────────
      - name: Build and push MCP Server (Cloud Build)
        run: |
          gcloud builds submit mcp-server \
            --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.MCP_SERVICE }}:${{ github.sha }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy MCP Server to Cloud Run
        run: |
          gcloud run deploy ${{ env.MCP_SERVICE }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.MCP_SERVICE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --service-account=operaiq-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},PUBSUB_TOPIC=operaiq-events,BIGQUERY_DATASET=operaiq,CHROMADB_PERSIST_DIR=/tmp/chromadb,FIRESTORE_COLLECTION_POSTMORTEMS=postmortems,FIRESTORE_COLLECTION_SILENCES=silences" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest" \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet

      # ── Agent Service ───────────────────────────────────────────────────────
      - name: Build and push Agent Service (Cloud Build)
        run: |
          gcloud builds submit agents \
            --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.AGENT_SERVICE }}:${{ github.sha }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Agent Service to Cloud Run
        run: |
          MCP_URL=$(gcloud run services describe ${{ env.MCP_SERVICE }} \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          gcloud run deploy ${{ env.AGENT_SERVICE }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.AGENT_SERVICE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --service-account=operaiq-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},MCP_SERVER_URL=${MCP_URL}" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Build and push Frontend (Cloud Build)
        run: |
          gcloud builds submit frontend \
            --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Frontend to Cloud Run
        run: |
          MCP_URL=$(gcloud run services describe ${{ env.MCP_SERVICE }} \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          AGENTS_URL=$(gcloud run services describe ${{ env.AGENT_SERVICE }} \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --service-account=operaiq-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="NEXT_PUBLIC_MCP_SERVER_URL=${MCP_URL},NEXT_PUBLIC_AGENTS_WS_URL=${AGENTS_URL}" \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet
